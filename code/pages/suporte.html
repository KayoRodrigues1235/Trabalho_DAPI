<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte</title>
    <link rel="stylesheet" href="/code/style/styleSuporte.css">
    <link rel="shortcut icon" href="/img/suporte.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="texto">
            <h2><i>SUPORTE</i></h2>

            <form>
                <label>Email</label>
                <input type="email" name="email" id="email" class="inputsSuporte" placeholder="exemplo@gmail.com" required>

                <label>Dúvida</label>
                <textarea name="duvida" placeholder="Escreva sua pergunta aqui..." id="duvidas" class="duvidasw" rows="4" required></textarea>

                <div class="botoes">
                    <button type="submit" id="envio" class="aceitar enviar" onclick="enviar(event)">Enviar</button>
                    <button class="cancelar" onclick="history.back()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>


    <script src="/code/scripts/scriptSuporte.js"></script>
</body>

</html>
