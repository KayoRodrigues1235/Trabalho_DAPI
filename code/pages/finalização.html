<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalização da Compra</title>
    <link rel="stylesheet" href="/code/style/style_finalizacao.css">
</head>
<body>
    <div class="container">
        <h2>Finalização da Compra</h2>
        <form id="formFinalizacao">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>

            <label for="endereco">Endereço de Entrega</label>
            <input type="text" id="endereco" name="endereco" required>

            <label for="pagamento">Forma de Pagamento</label>
            <select id="pagamento" name="pagamento" required>
                <option value="">Selecione</option>
                <option value="credito">Cartão de Crédito</option>
                <option value="debito">Cartão de Débito</option>
                <option value="pix">PIX</option>
            </select>

            <div id="pagamento-especifico"></div>

            <button type="submit">Confirmar Pedido</button>
        </form>
        <div class="mensagem" id="mensagem"></div>
    </div>
    <script src="/code/scripts/finalizacao.js"></script>
</body>
</html>
